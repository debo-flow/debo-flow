name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours at 00:00 and 12:00 UTC
    - cron: "0 */12 * * *"
  workflow_dispatch:
    # Enable manual execution from the GitHub Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and Publish Snake Animation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        # Pinning actions/checkout@v4 (v4.2.2) to verified commit SHA
        uses: actions/checkout@v4@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Generate Contribution Snake SVGs
        # Official Platane/snk action (v3)
        uses: Platane/snk@v3
        with:
          github_user_name: debo-flow
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Verify Generated Assets
        run: |
          echo "Verifying generated SVG files..."
          ls -la dist/
          if [ ! -f "dist/github-contribution-grid-snake.svg" ] || [ ! -f "dist/github-contribution-grid-snake-dark.svg" ]; then
            echo "Error: Required SVG files were not found in the output directory."
            exit 1
          fi

      - name: Publish to Output Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Create an orphan branch for isolated asset storage
          git checkout --orphan output
          git rm -rf .
          
          # Copy generated SVGs to the root of the output branch
          cp dist/github-contribution-grid-snake.svg ./github-contribution-grid-snake.svg
          cp dist/github-contribution-grid-snake-dark.svg ./github-contribution-grid-snake-dark.svg
          
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          
          if git diff --staged --quiet; then
            echo "No changes detected in generated SVGs."
          else
            git commit -m "chore: update contribution snake animations [skip ci]"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin output --force
          fi
